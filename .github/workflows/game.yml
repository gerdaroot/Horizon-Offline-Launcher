# The game, as the launcher installs it. Horizon ships only Nightlies now (docs/release-flow.md), and
# so does this fork: a run builds this fork's horizon-client for Linux, Windows and macOS (Apple
# Silicon and Intel) and puts it into Horizon's own Nightly files (their exporters, horizon-prepare
# and the rest are built from Mojang's jars on Horizon's private runner), then signs the checksums
# for the nightly channel and publishes them as this repository's `nightly` pre-release, titled
# "Nightly <date> · <this fork's commit>". The one before stays a week as nightly-<its date>.
# The launcher's own release stays GitHub's "latest", where install.ps1 and install.sh download
# from.
name: game

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Horizon's release whose files the client goes into (nightly = Horizon's current Nightly)
        default: nightly
        required: true

permissions:
  contents: read

concurrency:
  group: game-nightly

env:
  UPSTREAM: ${{ inputs.upstream }}
  HORIZON_TELEMETRY_URL: "off"

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.pick.outputs.date }}
      short: ${{ steps.pick.outputs.short }}
      upstream_name: ${{ steps.pick.outputs.upstream_name }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/horizon-rust/horizon/releases/tags/$UPSTREAM" --jq .name)
          echo "Horizon's $UPSTREAM: $name"
          # Every platform takes the files of this one Nightly, even if Horizon publishes the next
          # while the clients build.
          mkdir upstream
          for asset in horizon-linux-x86_64.tar.gz horizon-windows-x64.zip horizon-macos-arm64.zip                        horizon-macos-x64.zip horizon-server-linux-x86_64.tar.gz; do
            gh release download "$UPSTREAM" -R horizon-rust/horizon -D upstream -p "$asset"
          done
          [[ "$(gh api "repos/horizon-rust/horizon/releases/tags/$UPSTREAM" --jq .name)" == "$name" ]]             || { echo "::error::Horizon's $UPSTREAM changed while downloading; run again"; exit 1; }
          {
            echo "date=$(date -u +%F)"
            echo "short=${GITHUB_SHA:0:7}"
            echo "upstream_name=$name"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream
          path: upstream/*
          retention-days: 3

  build:
    name: build ${{ matrix.name }}
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            asset: horizon-linux-x86_64.tar.gz
            client: horizon-client
            # Horizon's server build, unchanged: packaging/server/install.sh installs it on Linux.
            server_asset: horizon-server-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            asset: horizon-windows-x64.zip
            client: horizon-client.exe
            # The C runtime linked in, so the game runs without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: macos
            os: macos-15
            asset: horizon-macos-arm64.zip
            client: horizon-client
          # Intel Macs: the same runner, another target.
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            asset: horizon-macos-x64.zip
            client: horizon-client
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # What the game says it is (--version, crash reports) and shows: as Horizon's Nightlies.
      HORIZON_VERSION: nightly-${{ needs.pick.outputs.date }}
      HORIZON_NIGHTLY: ${{ needs.pick.outputs.date }} ${{ needs.pick.outputs.short }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: game-${{ matrix.name }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Build the client
        run: |
          target=(); [[ -n "${{ matrix.target }}" ]] && target=(--target "${{ matrix.target }}")
          cargo build --release --locked -p horizon-client --bin horizon-client "${target[@]}"
          out=target/release; [[ -n "${{ matrix.target }}" ]] && out="target/${{ matrix.target }}/release"
          echo "CLIENT=$out/${{ matrix.client }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: upstream
          path: horizon-files
      - name: Horizon's files of that Nightly
        run: |
          mkdir -p upstream dist
          mv "horizon-files/${{ matrix.asset }}" upstream/
          if [[ -n "${{ matrix.server_asset }}" ]]; then
            mv "horizon-files/${{ matrix.server_asset }}" dist/
          fi
          rm -rf horizon-files
      - name: Put this fork's client in them
        run: |
          set -euo pipefail
          cd upstream
          case "${{ matrix.asset }}" in
            *.tar.gz) tar -xzf "${{ matrix.asset }}" ;;
            *) unzip -q "${{ matrix.asset }}" ;;
          esac
          rm "${{ matrix.asset }}"
          found=$(find . -type f -name "${{ matrix.client }}" | head -1)
          [[ -n "$found" ]] || { echo "::error::Horizon's ${{ matrix.asset }} has no ${{ matrix.client }}"; exit 1; }
          cp "../$CLIENT" "$found"
          chmod +x "$found"
          # Horizon's Developer ID signature belonged to its own binary: sign this one ad hoc, as
          # Apple Silicon runs nothing unsigned.
          if [[ "$RUNNER_OS" == macOS ]]; then codesign --force --sign - "$found"; fi
          top=$(dirname "$found" | cut -d/ -f2)
          case "${{ matrix.asset }}" in
            *.tar.gz) tar -czf "../dist/${{ matrix.asset }}" "$top" ;;
            *) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "../dist/${{ matrix.asset }}" "$top" > /dev/null
               else ditto -c -k --norsrc --noextattr --noqtn --keepParent "$top" "../dist/${{ matrix.asset }}"; fi ;;
          esac
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.name }}
          path: dist/*

  release:
    needs: [pick, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: game-*
          merge-multiple: true
      - name: Sign the checksums (SHA256SUMS, SHA256SUMS.sig) for the nightly channel
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          bash tools/ci/sign_release.sh nightly dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip \
            dist/horizon-macos-arm64.zip dist/horizon-macos-x64.zip dist/horizon-server-linux-x86_64.tar.gz
      - uses: dtolnay/rust-toolchain@stable
      - name: The signature, checked as launchers check it
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag nightly --publishing dist
      - name: Publish as the `nightly` pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.pick.outputs.date }}
          SHORT: ${{ needs.pick.outputs.short }}
          UPSTREAM_NAME: ${{ needs.pick.outputs.upstream_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          This fork's game client (commit $SHORT) in Horizon's own files of $UPSTREAM_NAME.
          Horizon Offline Launcher installs it by itself; there is nothing to download here by hand.
          EOF
          python3 tools/ci/nightly.py rotate
          # A pre-release, never GitHub's latest: the latest stays the launcher's own release.
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $DATE · $SHORT" --notes-file notes.md \
            "dist/horizon-linux-x86_64.tar.gz#Game files the launcher installs: Linux (horizon-linux-x86_64.tar.gz)" \
            "dist/horizon-windows-x64.zip#Game files the launcher installs: Windows (horizon-windows-x64.zip)" \
            "dist/horizon-macos-arm64.zip#Game files the launcher installs: macOS on Apple Silicon (horizon-macos-arm64.zip)" \
            "dist/horizon-macos-x64.zip#Game files the launcher installs: macOS on Intel (horizon-macos-x64.zip)" \
            "dist/horizon-server-linux-x86_64.tar.gz#Horizon's dedicated server for Linux (horizon-server-linux-x86_64.tar.gz)" \
            dist/SHA256SUMS dist/SHA256SUMS.sig
          python3 tools/ci/nightly.py prune --days 7
