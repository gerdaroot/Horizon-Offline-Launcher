# Horizon Offline Launcher: tests on every push and pull request; a tag `launcher@1.2.3` builds the
# launcher for Windows (x64 with its installer, and ARM64), Linux and macOS, signs the checksums and publishes them
# as a GitHub release, which launchers already installed update themselves from.
name: launcher

on:
  push:
    branches: [main]
    tags: ['launcher@*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  # The tests run once, on Linux: some of upstream's tests depend on the machine (the trash on
  # Windows, macOS on a hosted runner), and a build never waits for them.
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Libraries GPUI links to
        run: bash tools/ci/apt_install.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - run: cargo test --release --locked

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            binary: horizon-launcher.exe
            asset: horizon-launcher-windows-x64.zip
            rustflags: -C target-feature=+crt-static
          # Windows on ARM: the same runner, another target. Optional: a release goes out without it.
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: horizon-launcher.exe
            asset: horizon-launcher-windows-arm64.zip
            rustflags: -C target-feature=+crt-static
            optional: true
          - name: linux
            os: ubuntu-22.04
            binary: horizon-launcher
            asset: horizon-launcher-linux-x86_64.tar.gz
          - name: macos
            os: macos-15
            binary: horizon-launcher
            asset: horizon-launcher-macos-arm64.zip
          # Intel Macs: the same runner, another target.
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            binary: horizon-launcher
            asset: horizon-launcher-macos-x64.zip
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          key: ${{ matrix.name }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: bash tools/ci/apt_install.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Metal shaders at run time without the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "LAUNCHER_FEATURES=gpui_platform/runtime_shaders" >> "$GITHUB_ENV"
          fi
      # A tag launcher@1.2.3 is the launcher's version 1.2.3; other builds say Cargo.toml's.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/launcher@')
        run: |
          echo "HORIZON_LAUNCHER_VERSION=${GITHUB_REF_NAME#launcher@}" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - run: cargo build --release --locked ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Package
        run: |
          mkdir -p ../dist
          out=target/release; [[ -n "${{ matrix.target }}" ]] && out="target/${{ matrix.target }}/release"
          case "${{ matrix.name }}" in
            windows*) 7z a -tzip ../dist/${{ matrix.asset }} "./$out/${{ matrix.binary }}" > /dev/null ;;
            linux) tar -czf ../dist/${{ matrix.asset }} -C "$out" ${{ matrix.binary }} ;;
            macos*) (cd "$out" && zip -q "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" ${{ matrix.binary }}) ;;
          esac
      # The installer most people download (packaging/windows/setup.iss); the zip stays what
      # launchers update themselves from.
      - name: Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $version = if ($env:HORIZON_LAUNCHER_VERSION) { $env:HORIZON_LAUNCHER_VERSION } else { "0.0.0" }
          & $iscc /Q "/DAppVersion=$version" "/DSource=$PWD\target\release\horizon-launcher.exe" "/O$PWD\..\dist" ..\packaging\windows\setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem ..\dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: Horizon-Offline-Launcher-Setup.exe
          path: dist/Horizon-Offline-Launcher-Setup.exe

  release:
    needs: [test, build]
    # The ARM64 build is optional: the release goes out with whatever was built.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/launcher@') && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the checksums (SHA256SUMS, SHA256SUMS.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          bash tools/ci/sign_release.sh "$GITHUB_REF_NAME" dist/*
      - uses: dtolnay/rust-toolchain@stable
      - name: The signature, checked as launchers check it
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$GITHUB_REF_NAME" dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Horizon Offline Launcher ${{ github.ref_name }}
          files: |
            dist/*
            install.ps1
            install.sh
          make_latest: true
          generate_release_notes: true
